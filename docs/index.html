<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>

<title>游戏合集</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:#0b0f12;color:#e8eef0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:680px;margin:0 auto;padding:46px 20px 60px;}
  h1{font-size:26px;letter-spacing:4px;margin:0 0 6px;}
  .sub{color:#8a98a0;font-size:13px;margin-bottom:30px;}
  a.card{display:block;text-decoration:none;color:inherit;border-radius:16px;padding:22px;margin-bottom:18px;border:1px solid #2a3640;transition:.16s;position:relative;overflow:hidden;}
  a.card:hover{transform:translateY(-3px);border-color:#5fb0c8;box-shadow:0 12px 36px #0007;}
  .war{background:linear-gradient(135deg,#16201a,#0e1612);}
  .vn{background:linear-gradient(135deg,#1c140c,#120c07);}
  .tag{font-size:11px;letter-spacing:2px;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:10px;}
  .tag.new{background:#274a32;color:#9fe0b0;}
  .tag.old{background:#3a2a16;color:#e0c45f;}
  .card h2{margin:0 0 8px;font-size:21px;letter-spacing:2px;}
  .card p{margin:0;color:#aab6bc;font-size:13.5px;line-height:1.7;}
  .go{position:absolute;right:20px;bottom:18px;color:#5fb0c8;font-size:13px;}
  .foot{color:#6a7882;font-size:12px;line-height:1.8;margin-top:24px;border-top:1px solid #1e2830;padding-top:16px;}
</style>
</head>
<body>
<div class="wrap">

  <a class="card war" href="wuren.html">

  </div>
</div>
