<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>判官归来 · 短剧 RPG 垂直切片</title>
<style>
  :root{ --gold:#d9b56a; --paper:#f3e9d6; --red:#b8332a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif; color:#f3ead8; overflow:hidden;}
  #app{position:fixed; inset:0; display:flex; flex-direction:column;
       background:radial-gradient(120% 90% at 50% 0%, #7a5a2e, #3a2a1c 70%, #150f0a); transition:background 1.2s ease;}
  #app.cold{background:radial-gradient(120% 90% at 50% 0%, #243042, #0e1520 75%, #060a10);}
  #app.night{background:radial-gradient(120% 100% at 50% 10%, #1a2230, #0a0e16 70%, #04060a);}
  #app.silence{background:#05060a; transition:background .35s ease;}
  #app.warm{background:radial-gradient(120% 90% at 50% 0%, #7a5a2e, #3a2a1c 70%, #150f0a);}

  #stage{flex:1; position:relative; display:flex; align-items:flex-end; justify-content:center; padding:18px; overflow:hidden;}
  #crowd{position:absolute; top:8%; left:0; right:0; text-align:center; font-size:13px; letter-spacing:6px; color:#caa86a88;}
  #portraits{display:flex; gap:24px; align-items:flex-end; transition:opacity .4s; flex-wrap:wrap; justify-content:center; max-width:920px;}
  .pc{display:flex; flex-direction:column; align-items:center; gap:8px; opacity:.45; transform:translateY(8px) scale(.96); transition:all .35s ease; filter:grayscale(.4);}
  .pc.active{opacity:1; transform:translateY(0) scale(1); filter:none;}
  .pc.shake{animation:shake .4s linear;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .avatar{width:92px; height:92px; border-radius:50%; display:flex; align-items:center; justify-content:center;
          font-size:40px; font-weight:700; color:#fff; box-shadow:0 6px 22px #0008, inset 0 0 0 3px #ffffff22;}
  .pc .name{font-size:14px; font-weight:600; letter-spacing:1px;}
  .pc .expr{font-size:12px; color:#e8d6a8; min-height:16px; opacity:.85;}
  @media(max-width:560px){ .avatar{width:68px;height:68px;font-size:30px} #portraits{gap:12px} }

  #hud{position:absolute; top:14px; left:14px; right:14px; display:flex; gap:12px; align-items:flex-start; pointer-events:none; flex-wrap:wrap;}
  .meter{background:#0006; border:1px solid #ffffff22; border-radius:10px; padding:8px 10px; min-width:150px; backdrop-filter:blur(4px); display:none;}
  .meter.on{display:block;}
  .meter .lab{font-size:11px; letter-spacing:1px; color:#e8d6a8; display:flex; justify-content:space-between;}
  .bar{height:8px; border-radius:6px; background:#ffffff18; margin-top:6px; overflow:hidden;}
  .bar > i{display:block; height:100%; border-radius:6px; transition:width .5s ease;}
  #tag-prestige{position:absolute; top:14px; right:14px; background:#0007; border:1px solid #d9b56a55; border-radius:20px; padding:5px 14px; font-size:12px; color:var(--gold); pointer-events:none;}

  #dlg{position:relative; margin:0 14px 16px; background:#120c07ee; border:1px solid #d9b56a55; border-radius:14px; padding:16px 18px 14px; min-height:124px; box-shadow:0 10px 40px #000a;}
  #speaker{position:absolute; top:-14px; left:18px; background:var(--red); color:#fff; font-size:13px; padding:3px 14px; border-radius:8px; letter-spacing:1px; box-shadow:0 4px 12px #0007; display:none;}
  #speaker.narr{background:#4a3a26;}
  #text{font-size:17px; line-height:1.85; min-height:58px; letter-spacing:.3px;}
  #text .sys{color:#7fd0d9; font-size:14px; display:block; margin-top:6px; border-left:3px solid #3a86c8; padding-left:10px;}
  #hint{text-align:right; font-size:12px; color:#caa86a; margin-top:8px; height:16px;}
  #hint.blink{animation:blink 1.1s infinite;}
  @keyframes blink{50%{opacity:.25}}

  #choices{display:flex; flex-direction:column; gap:10px; margin:2px 14px 18px;}
  .choice{background:#23180e; border:1px solid #d9b56a66; color:#f3ead8; text-align:left; padding:13px 16px; border-radius:11px; font-size:15.5px; cursor:pointer; transition:all .18s; line-height:1.5;}
  .choice:hover{background:#39260f; border-color:var(--gold); transform:translateX(4px);}
  .choice.lock{opacity:.5; cursor:not-allowed;} .choice.lock:hover{transform:none; border-color:#d9b56a66; background:#23180e;}
  .choice .tag{display:inline-block; font-size:11px; color:#1a1410; background:var(--gold); padding:1px 8px; border-radius:6px; margin-right:8px; font-weight:700;}
  .choice small{display:block; color:#caa86a; font-size:12px; margin-top:4px;}

  .overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; background:#06060ad8; backdrop-filter:blur(3px); z-index:30; padding:24px; overflow:auto;}
  .overlay h1{font-size:38px; margin:0; letter-spacing:8px; color:var(--gold); text-shadow:0 4px 20px #000;}
  .overlay h2{font-size:17px; margin:0; color:#e8d6a8; font-weight:400; letter-spacing:3px;}
  .overlay p{max-width:520px; line-height:1.8; color:#cbb98f; font-size:14px; margin:0;}
  .btn{background:var(--red); color:#fff; border:none; padding:12px 34px; border-radius:30px; font-size:16px; letter-spacing:3px; cursor:pointer; box-shadow:0 6px 24px #0008; transition:transform .15s;}
  .btn:hover{transform:scale(1.05);}
  .btn.ghost{background:#2a1d10; border:1px solid var(--gold); color:var(--gold);}

  .chaps{display:flex; flex-direction:column; gap:12px; width:100%; max-width:440px;}
  .chap{background:#1d150c; border:1px solid #d9b56a55; border-radius:12px; padding:14px 16px; text-align:left; cursor:pointer; transition:all .18s;}
  .chap:hover{background:#2c1f10; border-color:var(--gold); transform:translateY(-2px);}
  .chap.locked{opacity:.5; cursor:not-allowed;} .chap.locked:hover{transform:none; background:#1d150c; border-color:#d9b56a55;}
  .chap.done{border-color:#5a8a5a99;}
  .chap .ct{font-size:16px; font-weight:600; display:flex; justify-content:space-between; align-items:center;}
  .chap .cd{font-size:12.5px; color:#caa86a; margin-top:5px; line-height:1.5;}
  .badge{font-size:11px; padding:2px 9px; border-radius:10px;}
  .badge.ok{background:#2f4a2f; color:#9ad99a;} .badge.lock{background:#3a2a2a; color:#d99a9a;} .badge.new{background:#4a3a16; color:var(--gold);}

  .scroll{background:linear-gradient(180deg,#efe4cd,#e3d3b0); color:#2a1d10; border-radius:14px; padding:20px 24px; max-width:430px; width:100%; box-shadow:0 14px 50px #000a, inset 0 0 0 2px #00000018; text-align:left;}
  .scroll h3{margin:0 0 12px; text-align:center; letter-spacing:4px; color:#7a2418;}
  .scroll .row{display:flex; justify-content:space-between; padding:8px 2px; border-bottom:1px dashed #00000022; font-size:14.5px;}
  .scroll .grade{font-size:42px; font-weight:800; text-align:center; margin:8px 0; letter-spacing:4px;}

  /* FX */
  #phone{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) scale(.6); width:150px; height:260px; background:#15171c; border-radius:18px; border:3px solid #2a2d33; box-shadow:0 18px 50px #000c; z-index:25; display:none; opacity:0; transition:opacity .5s, transform .5s;}
  #phone .screen{position:absolute; inset:14px; background:#0a1c24; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-direction:column; overflow:hidden;}
  #phone .crk{position:absolute; inset:0; background:linear-gradient(115deg,transparent 48%,#ffffff55 49%,transparent 50%),linear-gradient(60deg,transparent 60%,#ffffff33 61%,transparent 62%);}
  #phone .who{font-size:28px; font-weight:800; letter-spacing:6px; color:#cfe9ff; opacity:0; transition:opacity 1s; text-shadow:0 0 12px #6cf;}
  #phone .who.on{opacity:1;}
  #phone .sub{font-size:11px; color:#7fd0d9; margin-top:8px; opacity:0; transition:opacity 1s;}
  #phone .sub.on{opacity:.9;}
  #flash{position:absolute; inset:0; background:#fff; opacity:0; z-index:40; pointer-events:none;}
  #glass{position:absolute; left:50%; top:30%; font-size:40px; opacity:0; z-index:26; pointer-events:none;}
  #silenceTxt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:35; font-size:22px; letter-spacing:10px; color:#fff; opacity:0; pointer-events:none; text-shadow:0 0 30px #000;}

  /* mini-game: timing strike */
  #mini{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:28; background:#04060acc;}
  #mini .title{font-size:16px; letter-spacing:3px; color:var(--gold);}
  #mini .track{position:relative; width:min(86vw,420px); height:46px; background:#0008; border:1px solid #ffffff25; border-radius:12px; overflow:hidden;}
  #mini .zone{position:absolute; top:0; bottom:0; background:linear-gradient(#b8332a55,#b8332a22); border-left:2px solid var(--red); border-right:2px solid var(--red);}
  #mini .marker{position:absolute; top:-4px; bottom:-4px; width:5px; background:#fff; box-shadow:0 0 12px #fff; border-radius:3px;}
  #mini .tip{font-size:13px; color:#cbb98f;}
  #mini .strikeBtn{background:var(--red); color:#fff; border:none; padding:14px 46px; border-radius:30px; font-size:18px; letter-spacing:4px; cursor:pointer;}
  #tapHint{position:absolute; bottom:6px; right:18px; font-size:11px; color:#caa86a66;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="hud">
      <div class="meter" id="m1"><div class="lab"><span id="m1lab">—</span><span id="m1num">0</span></div><div class="bar"><i id="m1bar" style="width:0%"></i></div></div>
      <div class="meter" id="m2"><div class="lab"><span id="m2lab">—</span><span id="m2num">0</span></div><div class="bar"><i id="m2bar" style="width:0%"></i></div></div>
    </div>
    <div id="tag-prestige">威望 <b id="prestigeNum">0</b></div>
    <div id="crowd"></div>
    <div id="portraits"></div>

    <div id="phone"><div class="screen"><div class="crk"></div><div class="who" id="phoneWho">陆 老</div><div class="sub" id="phoneSub">来电…</div></div></div>
    <div id="glass">🥃</div>
    <div id="silenceTxt"></div>
    <div id="flash"></div>

    <div id="mini">
      <div class="title" id="miniTitle">一击制敌</div>
      <div class="tip" id="miniTip">光标进入红区的瞬间——出手。</div>
      <div class="track"><div class="zone" id="miniZone"></div><div class="marker" id="miniMarker"></div></div>
      <button class="strikeBtn" id="miniBtn">出 手</button>
    </div>
  </div>

  <div id="dlg"><div id="speaker"></div><div id="text"></div><div id="hint"></div></div>
  <div id="choices"></div>
  <div id="tapHint">点击对话框继续 ▸</div>

  <div class="overlay" id="titleScreen">
    <h2>都市复仇 RPG · 短剧垂直切片</h2>
    <h1>判 官 归 来</h1>
    <p>改编自《九年战神归来,前妻哭着求复婚》。<br>九年前你被扫地出门;九年后,你以「判官」之身归来。<br>这把游戏,你很少动手——<b>受气是弹药,身份是武器。</b></p>
    <button class="btn" onclick="Hub.open(true)">进 入</button>
  </div>

  <div class="overlay" id="hubScreen" style="display:none">
    <h2 style="color:var(--gold)">章 节 选 择</h2>
    <div class="chaps" id="chapList"></div>
    <p id="hubStat" style="margin-top:4px"></p>
  </div>

  <div class="overlay" id="endScreen" style="display:none">
    <div class="scroll" id="endScroll"></div>
    <button class="btn" id="endBtn">返 回 章 节</button>
  </div>
</div>

<script>
/* ===================== shared state ===================== */
const State = {
  prestige:0, favor:0, liMarked:false,
  evidence:[], laojiu:false,
  done:{}, // chapter id -> grade
};
const CHARS = {
  linzhao:{name:"林昭", color:"#3b5a73", face:"林"},
  shengd: {name:"沈国栋", color:"#7a4a2a", face:"沈"},
  zhixia: {name:"沈知夏", color:"#a84a78", face:"夏"},
  weiwan: {name:"沈未晚", color:"#5a6e8a", face:"晚"},
  liping: {name:"李广平", color:"#5a5a3a", face:"李"},
  luhong: {name:"陆鸿志", color:"#3a5a4a", face:"陆"},
  laojiu: {name:"老九", color:"#555555", face:"九"},
};

/* ===================== engine ===================== */
const $=id=>document.getElementById(id);
const portraitsEl=$("portraits"), speakerEl=$("speaker"), textEl=$("text"), hintEl=$("hint"), choicesEl=$("choices");
let typing=false, typeTimer=null, fullText="", waitingTap=false, pendingNext=null;

function buildPortraits(order){
  portraitsEl.innerHTML="";
  order.forEach(k=>{
    const c=CHARS[k]; const d=document.createElement("div"); d.className="pc"; d.id="pc-"+k;
    d.innerHTML=`<div class="avatar" style="background:${c.color}">${c.face}</div><div class="name">${c.name}</div><div class="expr" id="expr-${k}"></div>`;
    portraitsEl.appendChild(d);
  });
}
function setExpr(k,e){ const el=$("expr-"+k); if(el)el.textContent=e||""; }
function activate(k){ document.querySelectorAll(".pc").forEach(p=>p.classList.remove("active")); const el=$("pc-"+k); if(el)el.classList.add("active"); }
function shake(k){ const el=$("pc-"+k); if(el){el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");} }
function mood(m){ const a=$("app"); a.className=""; if(m)a.classList.add(m); }
function crowd(t){ $("crowd").textContent=t||""; }
function setPrestige(){ $("prestigeNum").textContent=State.prestige; }

function meter(slot,{label,val,max=100,color="#e0563f",show=true}){
  const m=$("m"+slot); if(!show){m.classList.remove("on"); return;} m.classList.add("on");
  $("m"+slot+"lab").textContent=label; $("m"+slot+"num").textContent=Math.round(val);
  const bar=$("m"+slot+"bar"); bar.style.width=Math.max(0,Math.min(100,val/max*100))+"%"; bar.style.background=color;
}
function hideMeters(){ $("m1").classList.remove("on"); $("m2").classList.remove("on"); }

function showLine(spk, html, opts={}){
  choicesEl.innerHTML="";
  if(spk==="narr"){ speakerEl.style.display="block"; speakerEl.className="narr"; speakerEl.textContent="旁白"; }
  else if(spk&&CHARS[spk]){ speakerEl.style.display="block"; speakerEl.className=""; speakerEl.textContent=CHARS[spk].name; activate(spk); }
  else speakerEl.style.display="none";
  if(opts.expr&&spk&&CHARS[spk]) setExpr(spk,opts.expr);
  if(opts.shake&&spk) shake(spk);
  fullText=html; textEl.innerHTML=html; const plain=textEl.textContent; textEl.innerHTML="";
  typing=true; hintEl.textContent=""; hintEl.classList.remove("blink"); clearTimeout(typeTimer);
  let i=0, buf="";
  (function step(){ if(i<plain.length){ buf+=plain[i++]; textEl.textContent=buf; typeTimer=setTimeout(step,16); }
    else { textEl.innerHTML=html; typing=false; readyTap(opts.next); } })();
}
function readyTap(next){ pendingNext=next; waitingTap=true; if(next){hintEl.textContent="▸ 继续"; hintEl.classList.add("blink");} }
function advanceTap(){
  if(typing){ clearTimeout(typeTimer); textEl.innerHTML=fullText; typing=false; readyTap(pendingNext); return; }
  if(waitingTap&&pendingNext){ waitingTap=false; hintEl.classList.remove("blink"); hintEl.textContent=""; const n=pendingNext; pendingNext=null; n(); }
}
$("dlg").addEventListener("click", advanceTap);
function setText(t){ speakerEl.style.display="none"; textEl.innerHTML=t; hintEl.textContent=""; }

function showChoices(list){
  speakerEl.style.display="none"; hintEl.textContent=""; hintEl.classList.remove("blink"); waitingTap=false; choicesEl.innerHTML="";
  list.forEach(ch=>{
    const b=document.createElement("button"); b.className="choice"+(ch.lock?" lock":"");
    b.innerHTML=(ch.tag?`<span class="tag">${ch.tag}</span>`:"")+ch.label+(ch.sub?`<small>${ch.sub}</small>`:"");
    if(!ch.lock) b.onclick=()=>{ choicesEl.innerHTML=""; ch.go(); };
    choicesEl.appendChild(b);
  });
}
// sequence runner: items are {s,t,o} lines or function(next)
function seq(items, done){
  let i=0;
  (function nextStep(){
    if(i>=items.length){ if(done)done(); return; }
    const st=items[i++];
    if(typeof st==="function") st(nextStep);
    else showLine(st.s, st.t, Object.assign({}, st.o, {next:nextStep}));
  })();
}

/* ===================== HUB ===================== */
const CHAPTERS=[
  {id:2, title:"第二关 · 寿宴上的不速之客", desc:"社交对决：用「身份/后台/冷场」三张底牌,攻破岳父的心理防线。", play:()=>Ch2.start(), unlocked:()=>true},
  {id:3, title:"第三关 · 那个名字叫判官", desc:"潜行偷听：跟出去,偷听李广平的灭口密谋,收集证据,再反手震慑。", play:()=>Ch3.start(),
   unlocked:()=>State.liMarked, lockMsg:"需在第二关「记住李广平这张脸」"},
  {id:5, title:"第五关 · 半夜来的不速之客", desc:"战斗点缀：一击制敌制服刺客老九,并反向收编为污点证人。", play:()=>Ch5.start(),
   unlocked:()=>!!State.done[2], lockMsg:"需先通关第二关"},
];
const Hub={
  open(fromTitle){
    $("titleScreen").style.display="none"; $("endScreen").style.display="none";
    hideMeters(); crowd(""); $("portraits").innerHTML=""; $("portraits").style.opacity="1"; mood("warm"); setPrestige();
    const list=$("chapList"); list.innerHTML="";
    CHAPTERS.forEach(c=>{
      const ok=c.unlocked(); const doneGrade=State.done[c.id];
      const d=document.createElement("div");
      d.className="chap"+(ok?"":" locked")+(doneGrade?" done":"");
      let badge = doneGrade?`<span class="badge ok">已通关 · ${doneGrade}</span>`
                : ok?`<span class="badge new">可游玩</span>`
                : `<span class="badge lock">未解锁</span>`;
      d.innerHTML=`<div class="ct">${c.title} ${badge}</div><div class="cd">${ok?c.desc:("🔒 "+c.lockMsg)}</div>`;
      if(ok) d.onclick=()=>c.play();
      list.appendChild(d);
    });
    const ev = State.evidence.length?`｜证据 ${State.evidence.length} 项`:"";
    const lj = State.laojiu?"｜污点证人·老九 已收编":"";
    $("hubStat").innerHTML=`威望 ${State.prestige}　好感 ${"♥".repeat(State.favor)||"—"}${ev}${lj}<br><small style="color:#8a7a5a">提示：按 2 → 3 → 5 的顺序玩,体验完整因果链。</small>`;
    $("hubScreen").style.display="flex";
  },
  toHub(){ $("hubScreen").style.display="flex"; Hub.open(); }
};

function chapEnd(id, grade, rows, verdict){
  State.done[id]=grade;
  let gc = grade==="S"?"#b8332a":grade==="A"?"#c9742a":grade==="C"?"#888":"#c98a2a";
  $("endScroll").innerHTML=`<h3>第${id}关 · 通关结算</h3>
    <div class="grade" style="color:${gc}">评级 ${grade}</div>
    ${rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}
    <p style="text-align:center;margin:14px 0 2px;color:#7a2418;font-size:13px;line-height:1.7">${verdict}</p>`;
  $("endBtn").onclick=()=>{ $("endScreen").style.display="none"; Hub.open(); };
  $("endScreen").style.display="flex";
}

/* ===================== CHAPTER 2 ===================== */
const Ch2={
  comp:100, contra:0, favor:0, liMark:false, badEarly:false, forcedB:false,
  start(){
    Object.assign(Ch2,{comp:100,contra:0,favor:0,liMark:State.liMarked,badEarly:false,forcedB:false});
    $("hubScreen").style.display="none"; $("endScreen").style.display="none";
    mood("warm"); buildPortraits(["weiwan","zhixia","shengd","linzhao","liping","luhong"]);
    crowd("· · ·  江 城 权 贵 云 集  · · ·"); $("portraits").style.opacity="1";
    Ch2.hud(); Ch2.intro();
  },
  hud(){ meter(1,{label:"沈国栋·心理防线",val:Ch2.comp,color:"#b8332a"}); meter(2,{label:"反差值·隐忍",val:Ch2.contra,color:"#3a86c8"}); },
  intro(){ seq([
    {s:"narr",t:"金陵大酒店三楼,沈国栋五十大寿。半个江城叫得上号的人物,今天都到了。"},
    {s:"zhixia",t:"姐,那个垃圾……真敢来吗?",o:{expr:"嚣张"}},
    {s:"weiwan",t:"……",o:{expr:"心不在焉"}},
    n=>{ mood("cold"); n(); },
    {s:"narr",t:"门口忽然骚动——「站住!请柬呢?」<span class='sys'>全场目光,看向门口。</span>"},
    {s:"narr",t:"一个穿洗白旧军绿外套、脚踩胶鞋的年轻人,两手空空,一步步走了进来。"},
    n=>{ shake("zhixia"); setExpr("zhixia","错愕"); n(); },
    {s:"zhixia",t:"姐你看!他真敢来!"},
    {s:"shengd",t:"林昭?<span class='sys'>威慑对决：攻破沈国栋心理防线（100→0）。你不必动手。</span>",o:{expr:"阴沉"}},
    {s:"linzhao",t:"沈伯父。五十大寿,恭喜。",o:{expr:"平静"}},

    const zoneX=W*0.30 + Math.random()*(W*0.40);
    zone.style.left=zoneX+"px"; zone.style.width=zoneW+"px";
    let pos=0, dir=1, speed=(attempt===1?3.2:4.4), raf=null, done=false;

        [["威望获得",`+${gain}`],["处理","报警移交"],["污点证人","未收编(老九被带走)"],["新证据","引爆器"]],
        "稳妥,但少了一张能反咬李广平的牌。试试『收编』路线,体验原著的反杀。");
    });
  },
};
